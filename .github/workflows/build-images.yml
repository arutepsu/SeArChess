name: Build and push Docker images

on:
  push:
    branches:
      - main
    # Image builds run only when application code, build definitions, or Dockerfiles
    # change. Commits that touch only docs, deployment manifests, infrastructure YAML,
    # or evidence files do not trigger image rebuilds — Argo CD syncs those directly.
    #
    # This is the CI/CD boundary contract:
    #   App change   → images rebuilt, sha-* tag written, Argo CD detects OutOfSync.
    #   Infra change → Argo CD applies the manifest change; no image rebuild.
    #   Docs change  → no CI action; nothing is deployed.
    #
    # Loop prevention for the overlay update commit (touches only kustomization.yaml):
    # 1. GITHUB_TOKEN pushes do not trigger push workflows (GitHub built-in).
    # 2. kustomization.yaml is not listed in paths below, so the commit never matches.
    # 3. [skip ci] in the commit message adds a third guard.
    paths:
      - 'apps/**'
      - 'modules/**'
      - 'project/**'
      - 'build.sbt'
      - '**/Dockerfile'
      - 'Dockerfile*'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: "Additional image tag (e.g. a release label). SHA tag is always applied."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: arutepsu

jobs:
  build-scala-services:
    name: Build Scala services
    runs-on: ubuntu-latest
    # Belt-and-suspenders: skip if the bot somehow triggers this job (e.g. via
    # workflow_dispatch). The paths filter above is the primary loop-prevention guard.
    if: github.actor != 'github-actions[bot]'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: game-service
            dockerfile: Dockerfile
            context: .
          - service: history-service
            dockerfile: Dockerfile.history
            context: .
          - service: ai-service
            dockerfile: Dockerfile.ai
            context: .

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHORT_SHA is the first 7 characters of GITHUB_SHA.
      # Tag format: sha-<SHORT_SHA>  e.g. sha-a1b2c3d
      - name: Set short SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/searchess-${{ matrix.service }}
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.SHORT_SHA }}
            type=raw,value=main-latest
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-python-ai-service:
    name: Build Python AI service
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout searchess (for workflow context)
        uses: actions/checkout@v6
        with:
          path: searchess

      - name: Checkout searchess-ai-service
        uses: actions/checkout@v6
        with:
          repository: arutepsu/searchess-ai-service
          path: searchess-ai-service
          # Use GITHUB_TOKEN for public repos; add a PAT secret for private repos:
          # token: ${{ secrets.AI_SERVICE_PAT }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/searchess-python-ai-service
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.SHORT_SHA }}
            type=raw,value=main-latest
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push python-ai-service
        uses: docker/build-push-action@v6
        with:
          context: searchess-ai-service
          file: searchess-ai-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=python-ai-service
          cache-to: type=gha,mode=max,scope=python-ai-service

  update-overlay:
    name: Update registry overlay image tags
    runs-on: ubuntu-latest
    needs: [build-scala-services, build-python-ai-service]
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set short SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Install kustomize so we can use `kustomize edit set image`.
      # Pinned to a specific version for reproducibility.
      - name: Install kustomize
        run: |
          VERSION=v5.4.3
          curl -sLo kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${VERSION}/kustomize_${VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/kustomize

      # Update the four GHCR service image tags to the immutable SHA tag.
      # mongo is intentionally not touched — it is pinned to 4.4 in the overlay
      # and is not managed by this workflow.
      - name: Update image tags in registry overlay
        run: |
          SHORT_SHA=${{ steps.sha.outputs.SHORT_SHA }}
          cd deployment/k8s/overlays/uni-server-registry
          kustomize edit set image \
            searchess/game-service=ghcr.io/arutepsu/searchess-game-service:sha-${SHORT_SHA} \
            searchess/history-service=ghcr.io/arutepsu/searchess-history-service:sha-${SHORT_SHA} \
            searchess/ai-service=ghcr.io/arutepsu/searchess-ai-service:sha-${SHORT_SHA} \
            searchess/python-ai-service=ghcr.io/arutepsu/searchess-python-ai-service:sha-${SHORT_SHA}

      # Render the overlay and assert all four GHCR app images resolve to the
      # expected SHA tag before committing. Fails the job if kustomize cannot
      # render valid YAML or if any image is still on a floating tag.
      - name: Validate rendered overlay
        run: |
          SHORT_SHA=${{ steps.sha.outputs.SHORT_SHA }}
          RENDERED=$(kubectl kustomize deployment/k8s/overlays/uni-server-registry)
          echo "$RENDERED"
          for SERVICE in game-service history-service ai-service python-ai-service; do
            EXPECTED="ghcr.io/arutepsu/searchess-${SERVICE}:sha-${SHORT_SHA}"
            if ! echo "$RENDERED" | grep -qF "$EXPECTED"; then
              echo "ERROR: expected image not found in rendered output: $EXPECTED"
              exit 1
            fi
          done
          echo "Validation passed: all four app images reference sha-${SHORT_SHA}"

      # Commit only kustomization.yaml.
      # [skip ci] in the message is the third loop-prevention layer (after GITHUB_TOKEN
      # push protection and the paths filter that excludes kustomization.yaml).
      # git pull --rebase handles the rare case where another run pushed first.
      - name: Commit and push tag update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment/k8s/overlays/uni-server-registry/kustomization.yaml
          git commit -m "Deploy images sha-${{ steps.sha.outputs.SHORT_SHA }} [skip ci]"
          git pull --rebase origin main
          git push origin main
