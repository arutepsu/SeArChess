static_resources:
  listeners:
    - name: public_edge
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: searchess_edge
                codec_type: AUTO
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: searchess_game_service
                      domains:
                        - "*"
                      routes:
                        # Public edge: expose Game Service health, gameplay API, and WebSocket only.
                        # Do not route AI /v1/move-suggestions, History /internal/events/game,
                        # the legacy History /events/game alias, or History /archives through Envoy.
                        - match:
                            path: /health
                          route:
                            cluster: game_service_http
                        - match:
                            prefix: /api/
                          route:
                            cluster: game_service_http
                            prefix_rewrite: /
                        - match:
                            prefix: /ws/
                          route:
                            cluster: game_service_ws
                        - match:
                            path: /admin/migrations
                          route:
                            cluster: game_service_http
                        - match:
                            prefix: /
                          direct_response:
                            status: 404
                            body:
                              inline_string: "not found\n"
                http_filters:
                  # ---------------------------------------------------------------------------
                  # JWT validation — local Compose only.
                  #
                  # Issuer matches the token iss claim: browser authenticated against localhost.
                  # JWKS is fetched internally: Envoy reaches Keycloak via compose DNS keycloak:8080.
                  #
                  # Protected:  /api/*  (except /api/health)
                  # Public:     /health, /api/health, /ws/*, /admin/migrations
                  # ---------------------------------------------------------------------------
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          issuer: "http://localhost:8080/realms/searchess"
                          audiences:
                            - searchess-api
                          remote_jwks:
                            http_uri:
                              uri: "http://keycloak:8080/realms/searchess/protocol/openid-connect/certs"
                              cluster: keycloak
                              timeout: 5s
                            cache_duration:
                              seconds: 300
                          forward: true
                      rules:
                        # Carve out /api/health before the protected /api/ prefix rule.
                        - match:
                            path: "/api/health"
                        # Require a valid JWT for all other /api/ routes.
                        - match:
                            prefix: "/api/"
                          requires:
                            provider_name: "keycloak"
                      # Let OPTIONS preflight pass without a token.
                      bypass_cors_preflight: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: game_service_http
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: game_service_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: game-service
                      port_value: 8080
    - name: game_service_ws
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: game_service_ws
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: game-service
                      port_value: 9090
    - name: keycloak
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: keycloak
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: keycloak
                      port_value: 8080

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
