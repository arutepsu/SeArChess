apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-service-env
  namespace: searchess
data:
  GATEWAY_HTTP_HOST: "0.0.0.0"
  GATEWAY_HTTP_PORT: "8087"
  # External tournament-server hosted at the university server.
  # gateway-service proxies /api/gateway/* here, injecting its own server-side JWT.
  # The browser never sees this URL or the tournament-server JWT.
  TOURNAMENT_SERVER_URL: "http://141.37.123.132:8086"
  # user-service ClusterIP — same namespace, resolved by kube-dns.
  # localhost would point to the gateway pod itself, not user-service.
  USER_SERVICE_URL: "http://user-service:8082"
  # GATEWAY_AUTH_DISABLED: "false" is the secure default.
  # Set to "true" only in local dev when Keycloak is not running.
  GATEWAY_AUTH_DISABLED: "false"
  # Static shared secret for the cluster-internal bot-runner move submission endpoint
  # (POST /api/internal/tournament/.../move/...). Must match TOURNAMENT_RUNNER_SERVICE_TOKEN
  # in tournament-service. Override with a strong random value via a Kubernetes Secret in
  # production overlays. The default here is only for base/dev environments.
  GATEWAY_RUNNER_SECRET: "searchess-runner-internal-token"
  JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
  OTEL_SERVICE_NAME: "searchess-gateway-service"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
