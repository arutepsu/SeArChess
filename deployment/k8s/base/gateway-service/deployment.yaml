apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: searchess
  labels:
    app: gateway-service
spec:
  # Replicas: 1 — TournamentJwtCache is an in-memory ConcurrentHashMap keyed by
  # Keycloak sub. Multi-replica requires sticky sessions or a shared JWT store.
  # Do not scale beyond 1 until the cache is externalised (e.g. Redis).
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: searchess/gateway-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
          envFrom:
            - configMapRef:
                name: gateway-service-env
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
