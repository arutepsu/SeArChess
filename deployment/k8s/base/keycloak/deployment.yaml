apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: searchess
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      # Wait for Postgres to be reachable before starting KC.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h postgres -U keycloak -d keycloak; do
                echo "waiting for keycloak DB..."; sleep 3
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: db-password
      containers:
        - name: keycloak
          # Pinned. Do not change without verifying start-mode compatibility.
          image: quay.io/keycloak/keycloak:26.6.2
          # start mode (not start-dev): production-shaped startup.
          # --import-realm: idempotent import of the realm ConfigMap on every boot.
          # HTTP-only is justified here because all external access is through an
          # SSH tunnel or kubectl port-forward; TLS is not configured on this server.
          args: ["start", "--import-realm"]
          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: db-password
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: bootstrap-admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: bootstrap-admin-password
            # Token issuer = http://localhost:18000/auth/realms/searchess.
            # KC_HOSTNAME must include the /auth path prefix so that Keycloak
            # generates login form actions and redirect URLs under /auth, matching
            # the Envoy route. Without the prefix the form action becomes
            # http://localhost:18000/realms/... which hits the web-ui nginx (405).
            - name: KC_HOSTNAME
              value: "http://localhost:18000/auth"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/auth"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Allow Envoy to fetch JWKS from the internal K8s DNS name (keycloak:8080)
            # even though KC_HOSTNAME is set to the browser-facing Envoy address.
            # Without this, the backchannel URL is derived from the request host,
            # which may differ from the configured frontend hostname.
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            # KC_HTTP_RELATIVE_PATH=/auth shifts the main HTTP base path, but
            # Keycloak 26 also shifts the management interface path by default.
            # Pin the management path to / so that /health/* is always reachable
            # on port 9000 regardless of the main path offset.
            - name: KC_HTTP_MANAGEMENT_RELATIVE_PATH
              value: "/"
          ports:
            - name: http
              containerPort: 8080
            # Keycloak 26 with KC_HEALTH_ENABLED=true serves /health/ready and
            # /health/live on the management interface (port 9000), not on the
            # main HTTP port (8080). Probes must target port 9000.
            - name: management
              containerPort: 9000
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import/realm-searchess.json
              subPath: realm-searchess.json
              readOnly: true
            - name: keycloak-theme-searchess
              mountPath: /opt/keycloak/themes/searchess/login
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            # 30 s initial delay + 60 × 10 s = up to 630 s for KC to finish
            # importing the realm and completing production-mode startup.
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Keycloak 26.6.2 in start (production) mode with realm import needs at
            # least 512 Mi to avoid OOMKill (exit 137) during startup. 1 Gi limit
            # provides headroom for realm-import spikes and is safe on the 4 GB VM.
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
        - name: keycloak-theme-searchess
          configMap:
            name: keycloak-theme-searchess
            items:
              - key: theme.properties
                path: theme.properties
              - key: login.css
                path: resources/css/login.css
              - key: logo256.png
                path: resources/img/logo256.png
              - key: favicon.ico
                path: resources/img/favicon.ico
              - key: background2.jpg
                path: resources/img/background2.jpg
