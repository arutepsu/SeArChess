apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: searchess
  annotations:
    # This plain secret is used only in local/dev overlays.
    # The uni-server-registry overlay MUST replace this with a SealedSecret.
    # Run scripts/seal-keycloak-secrets.sh to generate the SealedSecret.
type: Opaque
stringData:
  bootstrap-admin-username: "PLACEHOLDER_change_me"
  bootstrap-admin-password: "PLACEHOLDER_change_me"
  db-password: "PLACEHOLDER_change_me"
