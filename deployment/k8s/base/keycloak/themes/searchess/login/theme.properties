parent=keycloak
import=common/keycloak
# Load PatternFly 4 from the parent keycloak theme first (Keycloak resolves files
# not found in the child theme up the parent chain), then append our overrides.
# Without the PF4 entry the styles list replaces the parent's entire list, dropping
# all layout CSS and leaving the form unstyled.
styles=node_modules/@patternfly/patternfly/patternfly.css css/login.css
