apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: searchess
generatorOptions:
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
resources:
  - namespace.yaml
  - secret-searchess.yaml
  # Edge
  - envoy/deployment.yaml
  - envoy/service.yaml
  # Web UI (SPA — served through Envoy at /)
  - web-ui/deployment.yaml
  - web-ui/service.yaml
  # Application services
  - game-service/configmap.yaml
  - game-service/deployment.yaml
  - game-service/service.yaml
  - user-service/configmap.yaml
  - user-service/deployment.yaml
  - user-service/service.yaml
  - bot-service/configmap.yaml
  - bot-service/deployment.yaml
  - lichess-bridge-service/configmap.yaml
  - lichess-bridge-service/deployment.yaml
  - lichess-bridge-service/service.yaml
  - history-service/configmap.yaml
  - history-service/deployment.yaml
  - history-service/service.yaml
  - analytics-service/configmap.yaml
  - analytics-service/deployment.yaml
  - analytics-service/service.yaml
  - tournament-service/configmap.yaml
  - tournament-service/deployment.yaml
  - tournament-service/service.yaml
  - ai-service/configmap.yaml
  - ai-service/deployment.yaml
  - ai-service/service.yaml
  # Python AI service (internal only — proxied by Scala ai-service)
  - python-ai-service/configmap.yaml
  - python-ai-service/deployment.yaml
  - python-ai-service/service.yaml
  # Data stores
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/job-keycloak-db-init.yaml
  - mongo/statefulset.yaml
  - mongo/service.yaml
  - redis/statefulset.yaml
  - redis/service.yaml
  # Auth
  - keycloak/secret.yaml
  - keycloak/deployment.yaml
  - keycloak/service.yaml
  # Observability
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  # Distributed tracing
  - tempo/configmap.yaml
  - tempo/deployment.yaml
  - tempo/service.yaml
  - otel-collector/configmap.yaml
  - otel-collector/deployment.yaml
  - otel-collector/service.yaml

configMapGenerator:
  - name: envoy-config
    files:
      - envoy/envoy.yaml

  - name: keycloak-realm
    files:
      - realm-searchess.json=keycloak/realm-searchess.json

  - name: keycloak-theme-searchess
    files:
      - theme.properties=keycloak/themes/searchess/login/theme.properties
      - login.css=keycloak/themes/searchess/login/resources/css/login.css
      - logo256.png=keycloak/themes/searchess/login/resources/img/logo256.png
      - favicon.ico=keycloak/themes/searchess/login/resources/img/favicon.ico
      - background2.jpg=keycloak/themes/searchess/login/resources/img/background2.jpg

  - name: prometheus-config
    files:
      - prometheus/prometheus.yml

  - name: grafana-datasources
    files:
      - grafana/provisioning/datasources/prometheus.yml
      - grafana/provisioning/datasources/tempo.yml

  - name: grafana-dashboard-providers
    files:
      - grafana/provisioning/dashboards/dashboard.yml

  - name: grafana-dashboards
    files:
      - grafana/dashboards/searchess-domain.json
      - grafana/dashboards/searchess-http.json
      - grafana/dashboards/searchess-jvm.json
