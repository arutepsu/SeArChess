global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: searchess-game-service
    metrics_path: /metrics
    static_configs:
      - targets: ['game-service:8080']

  - job_name: searchess-history-service
    metrics_path: /metrics
    static_configs:
      - targets: ['history-service:8081']

  - job_name: searchess-ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-service:8765']
