apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-ai-service
  namespace: searchess
  labels:
    app: python-ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-ai-service
  template:
    metadata:
      labels:
        app: python-ai-service
    spec:
      containers:
        - name: python-ai-service
          image: searchess/python-ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          envFrom:
            - configMapRef:
                name: python-ai-service-env
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # torch CPU wheel adds ~700 MB RSS even without a loaded model.
              # Raise to 2000Mi in the overlay if using supervised backend.
              memory: "1000Mi"
              cpu: "500m"
