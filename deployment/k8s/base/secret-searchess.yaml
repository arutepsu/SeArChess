# WARNING: base Secret contains placeholder values only.
# Override for each environment:
#   local-k3d overlay: patches/secret-dev.yaml (dev defaults, not for production)
#   production:        use Sealed Secrets (deferred — see docs/deployment/deployment-inventory.md)
apiVersion: v1
kind: Secret
metadata:
  name: searchess-secrets
  namespace: searchess
type: Opaque
stringData:
  postgres-password: "PLACEHOLDER_change_me"
  grafana-admin-password: "PLACEHOLDER_change_me"
  migration-admin-token: ""
  # Used by bot-service as BOT_WORKER_API_KEY.
  # TODO: rename this key to bot-worker-api-key in a follow-up secret migration.
  external-game-bot-api-key: ""
