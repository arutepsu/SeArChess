# Dev-only secret values for local-k3d-fast.
# These are NOT secrets — they mirror the Compose dev defaults.
# Do NOT use this overlay in any internet-accessible environment.
# Real Lichess token and external-game-bot-api-key must be patched after apply:
#   kubectl patch secret searchess-secrets -n searchess \
#     --type=merge \
#     -p '{"stringData":{"lichess-bot-token":"TOKEN","external-game-bot-api-key":"KEY"}}'
apiVersion: v1
kind: Secret
metadata:
  name: searchess-secrets
  namespace: searchess
stringData:
  postgres-password: "searchess"
  grafana-admin-password: "admin"
  migration-admin-token: ""
  external-game-bot-api-key: ""
  lichess-bot-token: ""
