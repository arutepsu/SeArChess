apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: searchess

resources:
  - ../../base

# Override image tags for images built and imported locally via k3d.
images:
  - name: searchess/game-service
    newTag: local
  - name: searchess/history-service
    newTag: local
  - name: searchess/ai-service
    newTag: local
  - name: searchess/bot-service
    newTag: local
  - name: searchess/python-ai-service
    newTag: local
  - name: searchess/web-ui
    newTag: local

patches:
  # Expose Envoy and Grafana as LoadBalancer — k3d servicelb forwards
  # these through the port mappings declared in deployment/k3d/cluster.yaml.
  - path: patches/envoy-loadbalancer.yaml
    target:
      kind: Service
      name: envoy
  - path: patches/grafana-loadbalancer.yaml
    target:
      kind: Service
      name: grafana

  # Set dev-friendly secret values (mirrors Compose defaults).
  - path: patches/secret-dev.yaml
    target:
      kind: Secret
      name: searchess-secrets

  # Never pull images — they are imported via 'k3d image import'.
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: game-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: history-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: ai-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: bot-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: python-ai-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: web-ui
