apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: searchess

resources:
  - ../../base

# Application images are built locally and imported into k3d via 'k3d image import'.
# The ':local' tag matches what the build scripts produce.
images:
  - name: searchess/game-service
    newTag: local
  - name: searchess/history-service
    newTag: local
  - name: searchess/ai-service
    newTag: local
  - name: searchess/bot-service
    newTag: local
  - name: searchess/python-ai-service
    newTag: local
  - name: searchess/web-ui
    newTag: local
  - name: searchess/analytics-service
    newTag: local
  - name: searchess/tournament-service
    newTag: local
  - name: searchess/user-service
    newTag: local
  - name: searchess/spark-analytics
    newTag: local
  - name: searchess/lichess-bridge-service
    newTag: local
  # Replace stock Keycloak with the local themed image so the searchess realm's
  # loginTheme: searchess resolves correctly in k3d (no registry pull needed).
  - name: quay.io/keycloak/keycloak
    newName: searchess/keycloak
    newTag: local
  # mongo:7.0 requires AVX CPU instructions which are not available on the
  # university VM. mongo:4.4 is the last release that does not require AVX.
  - name: mongo
    newTag: "4.4"

patches:
  # Expose Envoy and Grafana as LoadBalancer — k3d servicelb forwards these
  # through the port mappings declared in deployment/k3d/server-cluster.yaml.
  - path: patches/envoy-loadbalancer.yaml
    target:
      kind: Service
      name: envoy
  - path: patches/grafana-loadbalancer.yaml
    target:
      kind: Service
      name: grafana

  # Set dev-friendly secret values (mirrors Compose defaults).
  - path: patches/secret-dev.yaml
    target:
      kind: Secret
      name: searchess-secrets

  # Never pull images — they are imported via 'k3d image import'.
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: game-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: history-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: ai-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: bot-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: python-ai-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: web-ui
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: analytics-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: tournament-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: user-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: spark-analytics
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: keycloak
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: lichess-bridge-service
