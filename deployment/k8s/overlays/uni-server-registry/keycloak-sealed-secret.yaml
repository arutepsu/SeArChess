apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-secrets
  namespace: searchess
  annotations:
    sealedsecrets.bitnami.com/managed: 'true'
    # OPERATOR ACTION REQUIRED — this file contains placeholder encrypted values.
    # The placeholders below will NOT decrypt to valid credentials.
    # Before enabling Keycloak on the university server, replace the encryptedData
    # values by running:
    #
    #   bash scripts/seal-keycloak-secrets.sh
    #
    # Commit the output file here and push to main to allow Argo CD to sync.
spec:
  encryptedData:
    # Replace all three values with output from scripts/seal-keycloak-secrets.sh
    bootstrap-admin-username: PLACEHOLDER_MUST_BE_SEALED
    bootstrap-admin-password: PLACEHOLDER_MUST_BE_SEALED
    db-password: PLACEHOLDER_MUST_BE_SEALED
  template:
    metadata:
      name: keycloak-secrets
      namespace: searchess
      annotations:
        sealedsecrets.bitnami.com/managed: 'true'
