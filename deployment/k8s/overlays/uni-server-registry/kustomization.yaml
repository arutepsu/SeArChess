apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: searchess

# python-ai-service uses an Argo Rollouts canary Rollout in this overlay only.
# The base Deployment/python-ai-service is removed via the delete patch below.
# local-k3d and uni-server-k3d continue to use the base Deployment unchanged.
# GitOps reconciliation CronJob for existing Keycloak clients; this is a
# resource, Dnot a patch, so Argo keeps it in normal cluster state.
resources:
- ../../base
- sealed-secret.yaml
- keycloak-sealed-secret.yaml
- keycloak-searchess-web-reconcile-job.yaml
- python-ai-service-rollout.yaml

# Override the base envoy-config ConfigMap with a copy whose JWT issuer and
# /auth route headers match the public KC_HOSTNAME below (patches/envoy-public.yaml).
# behavior: replace regenerates the ConfigMap (new hash) so Envoy rolls on apply.
configMapGenerator:
- behavior: replace
  files:
  - envoy.yaml=patches/envoy-public.yaml
  name: envoy-config

# Image tags are managed by CI (.github/workflows/build-images.yml).
# Only services whose app-code paths changed are rebuilt and have their tag updated
# in this file. Services not rebuilt in a given push retain their existing sha-* tag.
# Argo CD detects OutOfSync when this file changes and auto-syncs (selfHeal: true).
# python-ai-service is only rebuilt via workflow_dispatch (rebuild_python_ai=true);
# it is never rebuilt automatically because its code lives in a separate repo.
#
# Tag meaning:
#   sha-<7-char-git-sha>  immutable — deployment source of truth for all Scala services
#                          (written by CI on each build, change triggers Argo CD sync)
#   main                  mutable — web-ui only; imagePullPolicy: Always on the pod
#                          ensures the new image is pulled on restart. Argo CD detects
#                          each build via the deploy-sha pod annotation in
#                          patches/web-ui-deploy-sha.yaml (updated by CI per build).
#   main-latest           floating convenience tag — never used for deployment
#
# analytics-service and tournament-service start at newTag: sha-placeholder —
# no image has been pushed to GHCR for them yet. build-images.yml forces a
# rebuild of any service still carrying sha-placeholder regardless of which
# files changed, the same safety net already used for user-service's bootstrap.
#
# Do not manually set Scala service tags to floating tags.
# web-ui intentionally uses 'main'; the deploy-sha patch triggers Argo CD rollouts.
# mongo is intentionally pinned to 4.4 and is not managed by the image workflow.
# mongo:7.0 requires AVX CPU instructions not available on the university VM.
# mongo:4.4 is the last release that does not require AVX.
# lichess-bridge-service: Phase 3A — replicas set to 1 via patch below.
# Custom image bakes the searchess login theme into
# /opt/keycloak/themes/searchess (see Dockerfile.keycloak), replacing the
# oversized generated ConfigMap that exceeded the 3 MiB object size limit.
images:
- name: mongo
  newTag: "4.4"
- name: quay.io/keycloak/keycloak
  newName: ghcr.io/arutepsu/searchess-keycloak
  newTag: sha-b66cbde
- name: searchess/ai-service
  newName: ghcr.io/arutepsu/searchess-ai-service
  newTag: sha-abd6f69
- name: searchess/analytics-service
  newName: ghcr.io/arutepsu/searchess-analytics-service
  newTag: sha-abd6f69
- name: searchess/bot-service
  newName: ghcr.io/arutepsu/searchess-bot-service
  newTag: sha-eb93c71
- name: searchess/game-service
  newName: ghcr.io/arutepsu/searchess-game-service
  newTag: sha-abd6f69
- name: searchess/gateway-service
  newName: ghcr.io/arutepsu/searchess-gateway-service
  newTag: sha-eb93c71
- name: searchess/history-service
  newName: ghcr.io/arutepsu/searchess-history-service
  newTag: sha-abd6f69
- name: searchess/lichess-bridge-service
  newName: ghcr.io/arutepsu/searchess-lichess-bridge-service
  newTag: sha-abd6f69
- name: searchess/python-ai-service
  newName: ghcr.io/arutepsu/searchess-python-ai-service
  newTag: sha-2247329
- name: searchess/spark-analytics
  newName: ghcr.io/arutepsu/searchess-spark-analytics
  newTag: sha-abd6f69
- name: searchess/tournament-service
  newName: ghcr.io/arutepsu/searchess-tournament-service
  newTag: sha-8171e7f
- name: searchess/user-service
  newName: ghcr.io/arutepsu/searchess-user-service
  newTag: sha-0c1004c
- name: searchess/web-ui
  newName: ghcr.io/arutepsu/searchess-web-ui
  newTag: main

# Expose Envoy and Grafana as LoadBalancer — k3d servicelb forwards these
# through the port mappings in deployment/k3d/server-cluster.yaml.
# Remove the base apps/v1 Deployment for python-ai-service from this overlay.
# The Rollout above takes over pod management. Without this patch both resources
# would coexist and fight over the same pods.
# Phase 3A: enable lichess-bridge-service with bot account arutepsu2.
# Challenge acceptance intentionally disabled; see patch for details.
# Public direct-access browser URL (http://141.37.123.125:10000) instead of
# the base's SSH-tunnel/port-forward default (http://localhost:18000).
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: bot-service
- path: patches/envoy-loadbalancer.yaml
  target:
    kind: Service
    name: envoy
- path: patches/grafana-loadbalancer.yaml
  target:
    kind: Service
    name: grafana
- path: patches/delete-plain-secret.yaml
  target:
    kind: Secret
    name: searchess-secrets
- path: patches/delete-keycloak-plain-secret.yaml
  target:
    kind: Secret
    name: keycloak-secrets
- path: patches/delete-python-ai-deployment.yaml
  target:
    group: apps
    kind: Deployment
    name: python-ai-service
    version: v1
- path: patches/tournament-service-runner.yaml
  target:
    kind: ConfigMap
    name: tournament-service-env
- path: patches/user-service-oauth.yaml
  target:
    kind: ConfigMap
    name: user-service-env
- path: patches/lichess-bridge-service-live.yaml
  target:
    kind: ConfigMap
    name: lichess-bridge-service-env
- path: patches/lichess-bridge-service-replicas.yaml
  target:
    kind: Deployment
    name: lichess-bridge-service
- path: patches/web-ui-deploy-sha.yaml
  target:
    kind: Deployment
    name: web-ui
- path: patches/keycloak-public-hostname.yaml
  target:
    kind: Deployment
    name: keycloak
