apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: searchess

resources:
  - ../../base

# Image tags are managed by CI (.github/workflows/build-images.yml).
# On every push to main, the workflow updates newTag to sha-<7-char-git-sha>,
# commits only this file back to main, and Argo CD detects OutOfSync.
# The operator then manually syncs Argo CD to apply the new tags.
#
# Tag meaning:
#   sha-<7-char-git-sha>  immutable — deployment source of truth (written by CI)
#   main-latest           floating convenience tag — never used for deployment
#
# Do not manually set newTag to 'main-latest' or any other floating tag.
# mongo is intentionally pinned to 4.4 and is not managed by the image workflow.
images:
  - name: searchess/game-service
    newName: ghcr.io/arutepsu/searchess-game-service
    newTag: performance-latest
  - name: searchess/history-service
    newName: ghcr.io/arutepsu/searchess-history-service
    newTag: performance-latest
  - name: searchess/ai-service
    newName: ghcr.io/arutepsu/searchess-ai-service
    newTag: performance-latest
  - name: searchess/python-ai-service
    newName: ghcr.io/arutepsu/searchess-python-ai-service
    newTag: performance-latest
  # mongo:7.0 requires AVX CPU instructions not available on the university VM.
  # mongo:4.4 is the last release that does not require AVX.
  - name: mongo
    newTag: "4.4"

patches:
  # Expose Envoy and Grafana as LoadBalancer — k3d servicelb forwards these
  # through the port mappings in deployment/k3d/server-cluster.yaml.
  - path: patches/envoy-loadbalancer.yaml
    target:
      kind: Service
      name: envoy
  - path: patches/grafana-loadbalancer.yaml
    target:
      kind: Service
      name: grafana

  # Dev-friendly secret values (mirrors Compose defaults).
  - path: patches/secret-dev.yaml
    target:
      kind: Secret
      name: searchess-secrets

  # imagePullPolicy is already IfNotPresent in the base Deployments.
  # GHCR images are pulled on first use; subsequent pod restarts use the
  # cached image unless the tag resolves to a new digest.
