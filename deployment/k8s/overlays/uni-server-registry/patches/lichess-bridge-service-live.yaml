apiVersion: v1
kind: ConfigMap
metadata:
  name: lichess-bridge-service-env
  namespace: searchess
data:
  # Phase 3B: controlled live challenge acceptance on uni-server-registry.
  #
  # INFRASTRUCTURE IDENTITY — NOT a Searchess user or Keycloak principal.
  # arutepsu2 is the dedicated central Lichess BOT service account controlled by
  # this bridge. Human users link their OWN Lichess accounts through Settings;
  # those linked accounts are authorized dynamically through user-service.
  #
  # Bot API endpoints used (required for BOT-upgraded account):
  #   GET  /api/bot/game/stream/{gameId}
  #   POST /api/bot/game/{gameId}/move/{uci}
  LICHESS_BRIDGE_ENABLED: "true"
  LICHESS_BOT_USERNAME: "arutepsu2"

  # Phase 3B: challenge acceptance enabled, but only for linked Searchess users.
  # Dynamic authorization:
  #   Lichess challenger username
  #   -> lichess-bridge-service
  #   -> user-service /internal/lichess/challenge-auth/{username}
  #   -> accept only if the Lichess account is linked in Searchess Settings.
  #
  # Do NOT use LICHESS_ALLOWED_CHALLENGERS here. Static allowlists are legacy only.
  LICHESS_ACCEPT_CHALLENGES: "true"

  # Conservative safety limits remain enforced.
  LICHESS_ACCEPT_RATED: "false"
  LICHESS_ALLOWED_VARIANTS: "standard"
  MAX_CONCURRENT_GAMES: "1"
  LICHESS_MIN_CLOCK_SECONDS: "180"
  LICHESS_MAX_CLOCK_SECONDS: "600"