# "edge" is NOT created by this file. It's the network the standalone local
# Keycloak stack (deployment/compose/docker-compose.yml) creates as
# "searchess_edge" — start that stack's `keycloak` service at least once
# before bringing Envoy up here, otherwise this network won't exist yet.
# Envoy joins it (in addition to the implicit "default" it shares with
# game-service/analytics-service/tournament-service) purely so it can resolve
# `keycloak:8080` by Docker DNS to fetch JWKS for JWT validation
# (config/envoy/envoy.yaml). Keycloak itself is untouched here.
networks:
  edge:
    name: searchess_edge
    external: true

services:
  envoy:
    image: envoyproxy/envoy:v1.32-latest
    networks:
      - default
      - edge
    depends_on:
      game-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    ports:
      - "10000:10000"
    volumes:
      - ./config/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro

  game-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
      searchess-ai-service:
        condition: service_healthy
      history-service:
        condition: service_healthy
    expose:
      - "8080"
      - "9090"
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      WS_ENABLED: "true"
      WS_PORT: 9090
      PERSISTENCE_MODE: ${PERSISTENCE_MODE:-postgres}
      SEARCHESS_POSTGRES_URL: jdbc:postgresql://postgres:5432/searchess
      SEARCHESS_POSTGRES_USER: searchess
      SEARCHESS_POSTGRES_PASSWORD: searchess
      SEARCHESS_MONGO_URI: mongodb://mongo:27017/searchess
      EVENT_MODE: in-process
      HISTORY_FORWARDING_ENABLED: "true"
      HISTORY_SERVICE_BASE_URL: http://history-service:8081
      HISTORY_FORWARDING_TIMEOUT_MILLIS: 2000
      HISTORY_DELIVERY_MODE: ${HISTORY_DELIVERY_MODE:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_GAME_EVENTS_TOPIC: ${KAFKA_GAME_EVENTS_TOPIC:-searchess.game.events.v1}
      USER_SERVICE_BASE_URL: http://user-service:8082
      USER_SERVICE_TIMEOUT_MILLIS: 3000
      AI_PROVIDER_MODE: remote
      AI_REMOTE_BASE_URL: http://searchess-ai-service:8765
      AI_TIMEOUT_MILLIS: 30000
      AI_REMOTE_TEST_MODE: ${AI_REMOTE_TEST_MODE:-}
      BOT_WORKER_API_KEY: ${BOT_WORKER_API_KEY:-searchess-local-bot-key}
      EXTERNAL_GAME_BOT_ACTOR_ID: ${EXTERNAL_GAME_BOT_ACTOR_ID:-arutepsu}
      BOT_WORKER_ACTOR_ID: ${BOT_WORKER_ACTOR_ID:-searchess-bot}
      MIGRATION_ADMIN_ENABLED: ${MIGRATION_ADMIN_ENABLED:-false}
      MIGRATION_ADMIN_TOKEN: ${MIGRATION_ADMIN_TOKEN:-}
      TRACE_EXPORT_ENABLED: "true"
      TRACE_ZIPKIN_ENDPOINT: http://tempo:9411/api/v2/spans
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8082"
    environment:
      USER_HTTP_HOST: 0.0.0.0
      USER_HTTP_PORT: 8082
      USER_POSTGRES_URL: jdbc:postgresql://postgres:5432/searchess
      USER_POSTGRES_USER: searchess
      USER_POSTGRES_PASSWORD: searchess
      USER_POSTGRES_SCHEMA: users
      USER_SERVICE_INTERNAL_API_KEY: ${USER_SERVICE_INTERNAL_API_KEY:-searchess-local-internal-key}
      WEB_UI_SETTINGS_URL: http://localhost:5173/settings
      LICHESS_OAUTH_REDIRECT_URI: http://localhost:10000/api/users/me/links/lichess/callback
      SEARCHESS_LICHESS_BOT_USERNAME: ${SEARCHESS_LICHESS_BOT_USERNAME:-arutepsu2}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  bot-service:
    build:
      context: .
      dockerfile: Dockerfile.bot-service
    depends_on:
      game-service:
        condition: service_healthy
    environment:
      GAME_SERVICE_BASE_URL: http://game-service:8080
      BOT_WORKER_API_KEY: ${BOT_WORKER_API_KEY:-searchess-local-bot-key}
    profiles:
      - bot-service

  history-service:
    build:
      context: .
      dockerfile: Dockerfile.history
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - "8081"
    environment:
      HISTORY_HTTP_HOST: 0.0.0.0
      HISTORY_HTTP_PORT: 8081
      GAME_SERVICE_BASE_URL: http://game-service:8080
      HISTORY_POSTGRES_URL: jdbc:postgresql://postgres:5432/searchess
      HISTORY_POSTGRES_USER: searchess
      HISTORY_POSTGRES_PASSWORD: searchess
      HISTORY_POSTGRES_SCHEMA: history
      HISTORY_GAME_SERVICE_TIMEOUT_MILLIS: 2000
      HISTORY_ACCEPT_LEGACY_INGESTION_PATH: "false"
      HISTORY_INGESTION_MODE: ${HISTORY_INGESTION_MODE:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_GAME_EVENTS_TOPIC: ${KAFKA_GAME_EVENTS_TOPIC:-searchess.game.events.v1}
      HISTORY_KAFKA_GROUP: ${HISTORY_KAFKA_GROUP:-history-service-game-projector}
      TRACE_EXPORT_ENABLED: "true"
      TRACE_ZIPKIN_ENDPOINT: http://tempo:9411/api/v2/spans
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      ANALYTICS_HTTP_HOST: 0.0.0.0
      ANALYTICS_HTTP_PORT: 8084
      ANALYTICS_POSTGRES_URL: jdbc:postgresql://postgres:5432/searchess
      ANALYTICS_POSTGRES_USER: searchess
      ANALYTICS_POSTGRES_PASSWORD: searchess
      ANALYTICS_POSTGRES_SCHEMA: public
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  tournament-service:
    build:
      context: .
      dockerfile: Dockerfile.tournament
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      TOURNAMENT_HTTP_HOST: 0.0.0.0
      TOURNAMENT_HTTP_PORT: 8085
      TOURNAMENT_JOB_STORE: postgres
      TOURNAMENT_POSTGRES_URL: jdbc:postgresql://postgres:5432/searchess
      TOURNAMENT_POSTGRES_USER: searchess
      TOURNAMENT_POSTGRES_PASSWORD: searchess
      TOURNAMENT_POSTGRES_SCHEMA: public
      TOURNAMENT_OUTBOX_PUBLISHER_ENABLED: "true"
      TOURNAMENT_OUTBOX_PUBLISHER_TYPE: logging
      TOURNAMENT_OUTPUT_BASE_PATH: /data/tournament-jobs
      # Packaged Spark analytics distribution baked into Dockerfile.tournament —
      # no sbt/source tree needed at runtime. These three already match the
      # image's own ENV defaults; listed explicitly here for visibility.
      TOURNAMENT_ANALYTICS_COMMAND: /app/spark-analytics/bin/run-analytics.sh
      TOURNAMENT_ANALYTICS_WORKING_DIR: /app
      TOURNAMENT_ANALYTICS_OUTPUT_BASE_PATH: /data/tournament-jobs/analytics-output
      # Bot runtime: SearchessAI and Stockfish.
      # Stockfish is installed inside the image (apt stockfish); path is /usr/games/stockfish.
      # For local host dev (sbt tournamentService/run), override STOCKFISH_PATH in .env.
      STOCKFISH_PATH: /usr/games/stockfish
      SEARCHESS_AI_BASE_URL: http://searchess-ai-service:8765
      # Read by the spark-analytics subprocess (inherited from this container's
      # environment), not by tournament-service itself. Schema must match
      # analytics-service's ANALYTICS_POSTGRES_SCHEMA so analytics-service can
      # read what Spark writes.
      POSTGRES_WRITE_ENABLED: "true"
      POSTGRES_URL: jdbc:postgresql://postgres:5432/searchess
      POSTGRES_USER: searchess
      POSTGRES_PASSWORD: searchess
      POSTGRES_SCHEMA: public
      POSTGRES_WRITE_MODE: append
      POSTGRES_STRICT_WRITE: "true"
    volumes:
      - tournament-jobs:/data/tournament-jobs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8085/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  searchess-ai-service:
    build:
      context: ../searchess-ai-service
      dockerfile: Dockerfile
    expose:
      - "8765"
    environment:
      INFERENCE_BACKEND: supervised
      # MODEL_RUN_ID selects which run directory under /artifacts to load.
      # Set MODEL_RUN_ID in .env or your shell before running docker compose up.
      MODEL_ARTIFACT_DIR: /artifacts/${MODEL_RUN_ID:-run_20260504_063449_ec53ea87}
    volumes:
      # Set AI_ARTIFACT_ROOT to the host directory that contains the run_* subdirectories.
      # Example (Windows): AI_ARTIFACT_ROOT=C:/uni/SA/artifacts docker compose up
      - type: bind
        source: ${AI_ARTIFACT_ROOT:-C:/uni/SA/artifacts}
        target: /artifacts
        read_only: true
    healthcheck:
      # python:3.12-slim has no curl — use stdlib urllib instead.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: searchess
      POSTGRES_USER: searchess
      POSTGRES_PASSWORD: searchess
    ports:
      - "5432:5432"
    volumes:
      - searchess_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchess -d searchess"]
      interval: 5s
      timeout: 3s
      retries: 12

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - searchess_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - searchess_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:3.9.1
    expose:
      - "9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - searchess_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 90s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: searchess-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./tools/performance/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - searchess_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  tempo:
    image: grafana/tempo:2.6.1
    user: "0:0"
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
      - "9411:9411"
    volumes:
      - ./tools/performance/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - searchess_tempo_data:/tmp/tempo
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./tools/performance/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./tools/performance/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - searchess_grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  searchess_postgres_data:
    name: searchess_postgres_data
  searchess_mongo_data:
    name: searchess_mongo_data
  searchess_redis_data:
    name: searchess_redis_data
  searchess_kafka_data:
    name: searchess_kafka_data
  tournament-jobs:
    name: searchess_tournament_jobs
  searchess_prometheus_data:
    name: searchess_prometheus_data
  searchess_tempo_data:
    name: searchess_tempo_data
  searchess_grafana_data:
    name: searchess_grafana_data
