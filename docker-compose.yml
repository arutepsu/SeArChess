services:
  envoy:
    image: envoyproxy/envoy:v1.32-latest
    depends_on:
      game-service:
        condition: service_healthy
    ports:
      - "10000:10000"
    volumes:
      - ./config/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro

  game-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      searchess-ai-service:
        condition: service_healthy
      history-service:
        condition: service_healthy
    expose:
      - "8080"
      - "9090"
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      WS_ENABLED: "true"
      WS_PORT: 9090
      PERSISTENCE_MODE: ${PERSISTENCE_MODE:-postgres}
      SEARCHESS_POSTGRES_URL: jdbc:postgresql://postgres:5432/searchess
      SEARCHESS_POSTGRES_USER: searchess
      SEARCHESS_POSTGRES_PASSWORD: searchess
      SEARCHESS_MONGO_URI: mongodb://mongo:27017/searchess
      EVENT_MODE: in-process
      HISTORY_FORWARDING_ENABLED: "true"
      HISTORY_SERVICE_BASE_URL: http://history-service:8081
      HISTORY_FORWARDING_TIMEOUT_MILLIS: 2000
      AI_PROVIDER_MODE: remote
      AI_REMOTE_BASE_URL: http://searchess-ai-service:8765
      AI_TIMEOUT_MILLIS: 30000
      AI_REMOTE_TEST_MODE: ${AI_REMOTE_TEST_MODE:-}
      BOT_WORKER_API_KEY: ${BOT_WORKER_API_KEY:-}
      EXTERNAL_GAME_BOT_ACTOR_ID: ${EXTERNAL_GAME_BOT_ACTOR_ID:-arutepsu}
      BOT_WORKER_ACTOR_ID: ${BOT_WORKER_ACTOR_ID:-searchess-bot}
      MIGRATION_ADMIN_ENABLED: ${MIGRATION_ADMIN_ENABLED:-false}
      MIGRATION_ADMIN_TOKEN: ${MIGRATION_ADMIN_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  bot-service:
    build:
      context: .
      dockerfile: Dockerfile.bot-service
    depends_on:
      game-service:
        condition: service_healthy
    environment:
      GAME_SERVICE_BASE_URL: http://game-service:8080
      BOT_WORKER_API_KEY: ${BOT_WORKER_API_KEY:-}
    profiles:
      - bot-service

  history-service:
    build:
      context: .
      dockerfile: Dockerfile.history
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8081"
    environment:
      HISTORY_HTTP_HOST: 0.0.0.0
      HISTORY_HTTP_PORT: 8081
      GAME_SERVICE_BASE_URL: http://game-service:8080
      HISTORY_POSTGRES_URL: jdbc:postgresql://postgres:5432/searchess
      HISTORY_POSTGRES_USER: searchess
      HISTORY_POSTGRES_PASSWORD: searchess
      HISTORY_POSTGRES_SCHEMA: history
      HISTORY_GAME_SERVICE_TIMEOUT_MILLIS: 2000
      HISTORY_ACCEPT_LEGACY_INGESTION_PATH: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  searchess-ai-service:
    build:
      context: ../searchess-ai-service
      dockerfile: Dockerfile
    expose:
      - "8765"
    environment:
      INFERENCE_BACKEND: supervised
      # MODEL_RUN_ID selects which run directory under /artifacts to load.
      # Set MODEL_RUN_ID in .env or your shell before running docker compose up.
      MODEL_ARTIFACT_DIR: /artifacts/${MODEL_RUN_ID:-run_20260504_063449_ec53ea87}
    volumes:
      # Set AI_ARTIFACT_ROOT to the host directory that contains the run_* subdirectories.
      # Example (Windows): AI_ARTIFACT_ROOT=C:/uni/SA/artifacts docker compose up
      - type: bind
        source: ${AI_ARTIFACT_ROOT:-C:/uni/SA/artifacts}
        target: /artifacts
        read_only: true
    healthcheck:
      # python:3.12-slim has no curl — use stdlib urllib instead.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: searchess
      POSTGRES_USER: searchess
      POSTGRES_PASSWORD: searchess
    ports:
      - "5432:5432"
    volumes:
      - searchess_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchess -d searchess"]
      interval: 5s
      timeout: 3s
      retries: 12

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - searchess_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - searchess_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  searchess_postgres_data:
    name: searchess_postgres_data
  searchess_mongo_data:
    name: searchess_mongo_data
  searchess_redis_data:
    name: searchess_redis_data
