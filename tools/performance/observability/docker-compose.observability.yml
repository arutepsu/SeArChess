# Observability stack: Prometheus + Grafana
#
# Default usage (main Searchess stack running in Docker):
#
#   docker compose up -d --build
#
#   cd tools/performance/observability
#   docker compose -f docker-compose.observability.yml up -d
#
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000  (admin / admin)
#
# Prometheus is attached to the main Searchess compose network and scrapes
# game-service:8080/metrics. Start the main stack first so the external
# searchess_default network exists.
#
# For local sbt / java -jar backend testing, use a local-specific Prometheus
# target such as host.docker.internal:8080 instead.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: searchess-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - default
      - searchess_app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: searchess-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  searchess_app:
    external: true
    name: searchess_default
